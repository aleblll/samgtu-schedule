name: Daily SamGTU Schedule Sync

on:
  schedule:
    # Запуск каждую ночь в 23:00 UTC (03:00 ночи по Самаре, UTC+4)
    - cron: '0 23 * * *'
  workflow_dispatch:
    # Возможность ручного запуска из интерфейса GitHub в любой момент

permissions:
  contents: write

jobs:
  sync-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nightly Schedule Sync & Audit
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '-1002345678901' }}
          AUTO_APPLY: 'true'
        run: npx tsx scripts/nightly_sync.ts --apply

      - name: Commit and push changes if schedule was updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain constants.ts)" ]; then
            git add constants.ts
            git commit -m "chore(schedule): automated nightly sync with official SamGTU API [skip ci]"
            git push
            echo "Changes pushed to repository."
          else
            echo "No schedule changes detected in constants.ts."
          fi
